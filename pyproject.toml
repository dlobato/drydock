[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["drydock", "examples/demo", "examples/evpn-symmetric-irb/bundle.py"]
explicit_package_bases = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["anta.*", "pyavd"]
ignore_missing_imports = true
