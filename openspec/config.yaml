schema: spec-driven

context: |
  Drydock orchestrates ephemeral switch labs through a CLI on an existing
  Kubernetes cluster with clabernetes. Keep the lifecycle core independent
  of cloud providers, AVD internals, and ANTA result handling.
  The cluster operator owns worker pools, autoscaling, scheduling policy,
  private routing, registry access, and provider authentication setup.
  GKE is the current test platform. Kubernetes on AWS is a future portability
  target that requires separate evidence. Keep GKE demo setup outside the core.
  Accept arbitrary cEOS topologies with complete rendered startup files.
  Preserve admitted topology fields and delegate address, link, and interface
  semantics to clabernetes. Inspect only identities, file references, and the
  safety policy needed for delivery and lifecycle operations. Keep startup
  and mapping contents opaque. Reject unsafe or unsupported features before allocation.
  The first scale target is 100 switches per lab with several concurrent labs.
  Record the qualified aggregate capacity instead of promising unlimited scale.
  Each approved workflow attempt receives a distinct lab with isolated ownership,
  even when switch names and management addresses match another active lab.
  Kubernetes stores ownership before workload allocation and retains expiry
  and cleanup outcomes. CLI output is JSON. No HTTP service or database is selected.
  Wait for capacity within a finite startup deadline bounded by expiry.
  Lab lifetime defaults to 30 minutes and cannot exceed 60 minutes from acceptance.
  Capacity waiting, startup, and tests consume the same lifetime. Retries do not renew it.
  The caller requests deletion after success, failure, timeout, or cancellation.
  An independent cluster-side cleaner runs every five minutes, retries incomplete
  deletion every five minutes indefinitely, and flags overdue cleanup.
  Target complete deletion 30 minutes after expiry while Kubernetes and backend APIs
  are available. Complete lab deletion does not require cluster worker scale-down.
  Return private connection inventory and authenticated management readiness.
  Discover current Pod-IP HTTPS endpoints through Kubernetes, preserve switch names,
  record Pod identities, and compare EOS hostnames. The external runner needs private routes.
  The private demo retains its agreed switch TLS verification exception.
  Keep password authentication and hostname comparison. Do not claim certificate-based
  switch identity or disable verification for Kubernetes and cloud endpoints.
  The pipeline owns standard AVD builds, startup/model consistency, ANTA catalog
  generation, network acceptance, reports, and unconditional cleanup requests.
  AVD structured configurations are pipeline inputs, not required lifecycle inputs.
  Keep pyavd[ansible]==6.5.0 and arista.avd.anta_runner as the existing example baseline.
  The six-switch example contains two spines and two MLAG pairs. It does not limit
  the topology contract. Require routing, EVPN, VXLAN, switch-link, and both MLAG-pair
  coverage for that example. Missing, skipped, errored, duplicate, or failed required
  results prevent network acceptance. Other fabrics use their applicable pipeline policy.
  Run lint and unit tests automatically on every PR and PR update without custom
  actor restrictions, cloud approval, private runners, or cloud credentials.
  Include fork PRs under GitHub's native execution policies.
  Pre-deployment GKE testing is opt-in for an identified PR commit before merge.
  Request optional tests through [digital-twin-test] in the latest PR commit or manual dispatch.
  Use a separate trusted workflow and the protected gke environment with
  the repository owner as required reviewer. A PR event alone must not request
  a lab or leave a GKE job waiting for approval without an explicit marker or dispatch.
  Use GitHub's native approval controls
  instead of custom owner or rerun actor authorization code.
  Bind Google authentication to the approved environment and trusted workflow.
  Use a pinned CLI from the protected default branch for credentialed lifecycle jobs.
  Use a dedicated self-hosted runner with private connectivity and temporary, limited
  access only for approved lab work. Isolate Ansible builds and tests from credentialed lifecycle execution.
  Keep personal cloud credentials, service-account keys, and administrative kubeconfigs
  out of GitHub. Enforce the lab boundary with Kubernetes permissions and admission policy.
  Provider-specific identity exchange stays outside Drydock. Do not administer cloud IAM,
  worker capacity, or RBAC from lifecycle commands. Fork execution on private runners remains excluded.
  Labs contain switches only. CloudVision, host containers, and interactive switch access
  remain excluded. Anonymize examples and leave reference repositories unchanged.
  The November 11 private-runtime demo passed 54 live ANTA results, both MLAG pairs,
  standalone lifecycle tests, and complete deletion without an experimental EOS firewall rule.
  The exact private build limits that evidence. It does not qualify the official release,
  arbitrary topologies, 100-switch scale, concurrency, or AWS compatibility.
  The November 13 workflow decision replaces the earlier manual-only policy with
  automatic PR lint and unit tests plus opt-in, environment-approved GKE tests.
  Task 8.1 implements automatic PR checks and an opt-in approval placeholder without cloud access.
  The user authorized the placeholder and marker to test native approval. Live GKE integration remains open.
  Task 8.2 adds a no-lab access probe, disabled Google federation setup,
  and an operator-installed Python TLS admission webhook with namespaced reader bindings.
  The user approved that admission component on November 13.
  Reuse lifecycle topology validation and existing dependencies. Do not add a general service framework.
  Keep federation disabled until the target cluster boundary, controlled private runner,
  and trusted workflow revision are ready. Local Kubernetes evidence is not live GitHub-to-GKE acceptance.
  The user approved an operator-controlled disposable runner dispatcher on November 13.
  Use the official GitHub scale-set SDK, one approved job per process, and no warm capacity.
  Authorize queue identity and native review before runner registration or VM creation.
  A root-owned guard must stop unexpected jobs before any workflow steps.
  Keep operator credentials outside the runner and enforce compute deletion through GCE's maximum runtime.
  Read only PR metadata through pull_request_target. Never execute PR code in that trigger.
  Keep the change active until implementation and live acceptance are complete.

rules:
  proposal:
    - Distinguish agreed scope, implemented code, and live acceptance evidence.
    - State exclusions and reference provenance without copying source data.
  design:
    - Keep runtime support claims tied to live evidence.
    - Cover cleanup independent of the operator and MLAG acceptance.
  tasks:
    - Include failure-path evidence and keep unperformed work unchecked.
    - Keep lifecycle implementation, pipeline integration, and live acceptance distinct.
