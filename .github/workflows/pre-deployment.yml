name: Opt-in digital twin
run-name: 'Digital twin request for PR #${{ github.event.pull_request.number || inputs.pull_request }}'

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open same-repository PR number into main
        required: true
        type: string
      selected_commit:
        description: Exact head selected by the metadata-only marker request
        required: false
        type: string
      fabric:
        description: Fabric to build and test after approval
        type: choice
        default: example
        options: [example, scale-100]

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    permissions:
      contents: read
      pull-requests: read
      actions: write
    if: >-
      ${{ github.repository == 'dlobato/drydock' &&
          github.ref == 'refs/heads/main' &&
          github.workflow_ref == 'dlobato/drydock/.github/workflows/pre-deployment.yml@refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      requested: ${{ steps.select.outputs.requested }}
      commit: ${{ steps.select.outputs.commit }}
      pull_request: ${{ steps.select.outputs.pull_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Select the exact PR commit before approval
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const select = require('./trusted/.github/scripts/select-pr.cjs');
            const provenance = await select({github, context, env: process.env});
            core.setOutput('requested', Boolean(provenance));
            if (provenance) {
              core.setOutput('commit', provenance.commit);
              core.setOutput('pull_request', provenance.pull_request);
              if (context.eventName === 'pull_request_target') {
                await github.rest.actions.createWorkflowDispatch({
                  ...context.repo, workflow_id: 'pre-deployment.yml', ref: 'main',
                  inputs: {pull_request: String(provenance.pull_request), selected_commit: provenance.commit},
                });
              }
              await core.summary.addHeading('Selected input')
                .addCodeBlock(JSON.stringify(provenance, null, 2), 'json').write();
            } else {
              await core.summary.addRaw('No pre-deployment request for this PR event.').write();
            }

  gke-lab:
    name: 'Approve ${{ inputs.fabric || ''example'' }} lab for PR #${{ needs.select.outputs.pull_request }} at ${{ needs.select.outputs.commit }}'
    needs: select
    if: ${{ github.event_name == 'workflow_dispatch' && needs.select.outputs.requested == 'true' }}
    environment:
      name: gke
      url: https://github.com/dlobato/drydock/commit/${{ needs.select.outputs.commit }}
    runs-on: [self-hosted, linux, x64, drydock-gke]
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.commit }}
          path: proposed
          persist-credentials: false
      - name: Build and establish model consistency and mandatory coverage without cloud access
        id: prepare
        working-directory: trusted
        env:
          PROPOSED_ROOT: ${{ github.workspace }}/proposed
          PIPELINE_IMAGE: ${{ vars.GKE_PIPELINE_IMAGE }}
          DRYDOCK_CEOS_IMAGE: ${{ vars.DRYDOCK_CEOS_IMAGE }}
          PR_COMMIT: ${{ needs.select.outputs.commit }}
          PIPELINE_FABRIC: ${{ inputs.fabric || 'example' }}
        run: python3 -m examples.github.pipeline prepare
      - name: Prepare renewable, limited federation for lifecycle containers
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GKE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GKE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: >-
            https://www.googleapis.com/auth/cloud-platform,
            https://www.googleapis.com/auth/userinfo.email
          create_credentials_file: true
          export_environment_variables: false
      - name: Create, wait, run standard ANTA, and delete through trusted tools
        working-directory: trusted
        env:
          GOOGLE_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GKE_CLUSTER_RESOURCE: ${{ vars.GKE_CLUSTER_RESOURCE }}
          DRYDOCK_ENVIRONMENT: ${{ vars.DRYDOCK_ENVIRONMENT }}
          PIPELINE_STATE: ${{ steps.prepare.outputs.state }}
        run: python3 -m examples.github.pipeline execute "$PIPELINE_STATE" >> "$GITHUB_STEP_SUMMARY"
      - name: Retry immediate lab deletion after any outcome
        if: ${{ always() && steps.prepare.outputs.state != '' }}
        working-directory: trusted
        env:
          PIPELINE_STATE: ${{ steps.prepare.outputs.state }}
        run: python3 -m examples.github.pipeline cleanup "$PIPELINE_STATE" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect safe reports after deletion attempts
        id: reports
        if: ${{ always() && steps.prepare.outputs.state != '' }}
        working-directory: trusted
        env:
          PIPELINE_STATE: ${{ steps.prepare.outputs.state }}
        run: python3 -m examples.github.pipeline collect "$PIPELINE_STATE"
      - name: Retain safe reports for seven days
        if: ${{ always() && steps.reports.outputs.path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digital-twin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.reports.outputs.path }}
          retention-days: 7
          if-no-files-found: error
      - name: Remove private build files and credentials
        if: ${{ always() && steps.prepare.outputs.state != '' }}
        env:
          PIPELINE_STATE: ${{ steps.prepare.outputs.state }}
        run: rm -rf -- "$PIPELINE_STATE"
